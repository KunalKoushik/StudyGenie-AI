name: StudyGenie AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck (Lint)
        run: npm run lint

      - name: Run Automated Test Suite
        env:
          JWT_SECRET: "studygenie_ci_test_super_secret_jwt_key_minimum_32_chars_2026"
          NODE_ENV: "test"
        run: npm test

      - name: Verify Production Build
        run: npm run build
